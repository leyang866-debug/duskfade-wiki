name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_PROFITRATE_SCRIPT_URL: https://pl31075146.profitableratecpmnetwork.com/1175ab871c6ed8cf90fb083fc1783520/invoke.js
          PUBLIC_PROFITRATE_CONTAINER_ID: container-1175ab871c6ed8cf90fb083fc1783520
      - run: npx wrangler deploy --assets dist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
